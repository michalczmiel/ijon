name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          uv sync --dev
          pnpm install --frozen-lockfile

      - name: Ruff check
        run: uv run ruff check

      - name: Biome check
        run: pnpm lint

      - name: Type check
        run: |
          uv run ty check
          pnpm typecheck

      - name: Pytest (shared suite, both implementations)
        run: uv run pytest
